sync:
  toronto-dev:
    alpha: '.'
    beta: 'toronto-dev:/home/shipsec/toronto'
    mode: 'two-way-resolved'
    ignore:
      vcs: true
      paths:
        # Git internals — worktree file on Mac vs full dir on server
        - '.git'
        # Dependencies — large and platform-specific
        - 'node_modules'
        - '**/node_modules'
        - 'bun.lockb'
        # Build outputs
        - 'dist'
        - '**/dist'
        - 'build'
        - '**/build'
        - '*.tsbuildinfo'
        # Environment files — server has its own configured .env files
        - '.env'
        - '**/.env'
        - '.env.*'
        - '**/.env.*'
        - 'docker/.env'
        # Runtime / instance state
        - '.shipsec-instance'
        - '.instances'
        - '.pm2'
        # Logs
        - '*.log'
        - 'logs'
        # Editor / OS
        - '.DS_Store'
        - '.idea'
        - '*.swp'
        - '*~'
        # Context dumps (may contain secrets)
        - '.context'
        # Planning artifacts
        - '.planning'

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backend
    image: shipsec-backend:ce
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-schema-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SHIPSEC_ENV: local
      SHIPSEC_INSTANCE: ${SHIPSEC_INSTANCE:-0}
      PORT: '3211'
      DATABASE_URL: postgresql://shipsec:shipsec@postgres:5432/shipsec
      SECRET_STORE_MASTER_KEY: ${SECRET_STORE_MASTER_KEY:-12345678901234567890123456789012}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret}
      AUTH_PROVIDER: local
      AUTH_LOCAL_ALLOW_UNAUTHENTICATED: 'true'
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:3211}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: shipsec-ce
      TEMPORAL_TASK_QUEUE: shipsec-ce
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: shipsec-files
      LOKI_URL: http://loki:3100
      LOG_KAFKA_BROKERS: redpanda:9092
      LOG_KAFKA_CLIENT_ID: shipsec-ce-backend
      LOG_KAFKA_GROUP_ID: shipsec-ce-log-consumer
      LOG_KAFKA_TOPIC: telemetry.logs
      EVENT_KAFKA_CLIENT_ID: shipsec-ce-backend-events
      EVENT_KAFKA_GROUP_ID: shipsec-ce-event-consumer
      EVENT_KAFKA_TOPIC: telemetry.events
      AGENT_TRACE_KAFKA_CLIENT_ID: shipsec-ce-agent-trace
      AGENT_TRACE_KAFKA_GROUP_ID: shipsec-ce-agent-trace
      AGENT_TRACE_KAFKA_TOPIC: telemetry.agent-trace
      NODE_IO_KAFKA_CLIENT_ID: shipsec-ce-node-io
      NODE_IO_KAFKA_GROUP_ID: shipsec-ce-node-io
      NODE_IO_KAFKA_TOPIC: telemetry.node-io
      ASSET_EVENT_KAFKA_TOPIC: asset.events
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: shipsec
      NEO4J_URI: bolt://neo4j:7687
      SHIPSEC_AWS_STRICT_IDENTITY_CHECK: 'false'
      SHIPSEC_AWS_ACCESS_KEY_ID: ${SHIPSEC_AWS_ACCESS_KEY_ID:-}
      SHIPSEC_AWS_SECRET_ACCESS_KEY: ${SHIPSEC_AWS_SECRET_ACCESS_KEY:-}
      SHIPSEC_AWS_SESSION_TOKEN: ${SHIPSEC_AWS_SESSION_TOKEN:-}
      SHIPSEC_PLATFORM_ROLE_ARN: ${SHIPSEC_PLATFORM_ROLE_ARN:-}
      SHIPSEC_GCP_IMPERSONATION_SOURCE_CREDENTIALS_JSON: ${SHIPSEC_GCP_IMPERSONATION_SOURCE_CREDENTIALS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      SHIPSEC_VERSION_CHECK_DISABLED: 'true'
      CORS_EXTRA_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '127.0.0.1:3211:3211'
    volumes:
      - ${SHIPSEC_SECURITY_WIKI_HOST_PATH:-../.local/security-wiki}:/var/lib/shipsec/security-wiki
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3211/api/v1/health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    image: shipsec-worker:ce
    user: root
    depends_on:
      backend:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-schema-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SHIPSEC_INSTANCE: ${SHIPSEC_INSTANCE:-0}
      DATABASE_URL: postgresql://shipsec:shipsec@postgres:5432/shipsec
      SECRET_STORE_MASTER_KEY: ${SECRET_STORE_MASTER_KEY:-12345678901234567890123456789012}
      LOG_KAFKA_BROKERS: redpanda:9092
      LOG_KAFKA_CLIENT_ID: shipsec-ce-worker
      LOG_KAFKA_TOPIC: telemetry.logs
      EVENT_KAFKA_CLIENT_ID: shipsec-ce-worker-events
      EVENT_KAFKA_TOPIC: telemetry.events
      AGENT_TRACE_KAFKA_CLIENT_ID: shipsec-ce-worker-agent-trace
      AGENT_TRACE_KAFKA_TOPIC: telemetry.agent-trace
      NODE_IO_KAFKA_CLIENT_ID: shipsec-ce-worker-node-io
      NODE_IO_KAFKA_TOPIC: telemetry.node-io
      ASSET_EVENT_KAFKA_TOPIC: asset.events
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      REDIS_URL: redis://redis:6379
      LOKI_URL: http://loki:3100
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: shipsec
      BACKEND_URL: http://backend:3211
      BACKEND_ORIGIN: http://localhost:3211
      STUDIO_API_BASE_URL: http://backend:3211/api/v1
      HOTPLUG_BACKEND_ORIGIN: ${HOTPLUG_BACKEND_ORIGIN:-}
      HOTPLUG_URL: ${HOTPLUG_URL:-}
      HOTPLUG_CONTROL_TOKEN: ${HOTPLUG_CONTROL_TOKEN:-}
      HOTPLUG_CLI_HOST_PATH: ${HOTPLUG_CLI_HOST_PATH:-}
      OPENCODE_AUTH_HOST_PATH: ${OPENCODE_AUTH_HOST_PATH:-}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: shipsec-ce
      TEMPORAL_TASK_QUEUE: shipsec-ce
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: shipsec-files
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: neo4j
      CARTOGRAPHY_NEO4J_URI: bolt://neo4j:7687
      CARTOGRAPHY_DOCKER_NETWORK: shipsec-ce-network
      CARTOGRAPHY_IMAGE: ${CARTOGRAPHY_IMAGE:-}
      CARTOGRAPHY_AWS_REQUESTED_SYNCS: ${CARTOGRAPHY_AWS_REQUESTED_SYNCS:-}
      SHIPSEC_AWS_ACCESS_KEY_ID: ${SHIPSEC_AWS_ACCESS_KEY_ID:-}
      SHIPSEC_AWS_SECRET_ACCESS_KEY: ${SHIPSEC_AWS_SECRET_ACCESS_KEY:-}
      SHIPSEC_AWS_SESSION_TOKEN: ${SHIPSEC_AWS_SESSION_TOKEN:-}
      SHIPSEC_PLATFORM_ROLE_ARN: ${SHIPSEC_PLATFORM_ROLE_ARN:-}
      SHIPSEC_GCP_IMPERSONATION_SOURCE_CREDENTIALS_JSON: ${SHIPSEC_GCP_IMPERSONATION_SOURCE_CREDENTIALS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      NAPI_RS_FORCE_WASI: '1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ${SHIPSEC_SECURITY_WIKI_HOST_PATH:-../.local/security-wiki}:/var/lib/shipsec/security-wiki
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3211}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3211}
    image: shipsec-frontend:ce
    command: ['bun', 'run', 'preview', '--host', '0.0.0.0', '--port', '5173']
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:5173'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:5173 >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

name: shipsec-ce

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipsec
      POSTGRES_PASSWORD: shipsec
      POSTGRES_DB: shipsec
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shipsec']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: '5432'
      DB_NAME: temporal
      POSTGRES_USER: shipsec
      POSTGRES_PWD: shipsec
      POSTGRES_SEEDS: postgres
      AUTO_SETUP: 'true'
    ports:
      - '127.0.0.1:7233:7233'
    volumes:
      - temporal_data:/var/lib/temporal
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - '127.0.0.1:8081:8080'
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:9092
    ports:
      - '127.0.0.1:9092:19092'
      - '127.0.0.1:9644:9644'
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9644/v1/status/ready']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yaml
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - ./redpanda-console-config.yaml:/etc/redpanda/console-config.yaml:ro
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    environment:
      CLICKHOUSE_DB: shipsec
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ''
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:8123:8123'
      - '127.0.0.1:9009:9000'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ../backend/src/analytics/schema/security-findings.init.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    mem_limit: 2048m
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  hotplug:
    image: ghcr.io/shipsecai/hotplug:v0.1.0
    user: root
    command: ['hotplug', 'serve', '--bind', '0.0.0.0:10010']
    environment:
      HOTPLUG_CONTROL_TOKEN: ${HOTPLUG_CONTROL_TOKEN:-hotplug-local-dev-token}
      RUST_LOG: ${HOTPLUG_LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:10011:10010'
    volumes:
      - hotplug_data:/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - /tmp/hotplug-host-runtime-secrets:/tmp/hotplug-host-runtime-secrets
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', "cypher-shell -u neo4j 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: shipsec-ce-network

volumes:
  postgres_data:
  temporal_data:
  minio_data:
  redis_data:
  loki_data:
  redpanda_data:
  clickhouse_data:
  hotplug_data:
  neo4j_data:

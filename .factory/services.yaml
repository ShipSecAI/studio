commands:
  install: bun install
  typecheck: bun run typecheck
  lint: bun run lint
  test: bun run test
  openapi: bun --cwd backend run generate:openapi && bun --cwd packages/backend-client run generate
  e2e: SHIPSEC_INSTANCE=2 bun run test:e2e

services:
  shipsec-instance-2:
    start: SHIPSEC_INSTANCE=2 just dev start
    stop: SHIPSEC_INSTANCE=2 just dev stop
    healthcheck: curl -sf http://localhost:5373 && curl -sf http://localhost:3411/api/v1/auth/validate
    port: 5373
    depends_on: []

  temporal-ui:
    start: SHIPSEC_INSTANCE=2 just dev start
    stop: SHIPSEC_INSTANCE=2 just dev stop
    healthcheck: curl -sf http://localhost:8081
    port: 8081
    depends_on: [shipsec-instance-2]

  neo4j-ui:
    start: SHIPSEC_INSTANCE=2 just dev start
    stop: SHIPSEC_INSTANCE=2 just dev stop
    healthcheck: curl -sf http://localhost:7474
    port: 7474
    depends_on: [shipsec-instance-2]
